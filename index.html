<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Bloch Sphere Simulation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; display: flex; height: 100vh; }
        #canvas-container { flex: 1; width: 100%; height: 100%; position: relative; }
        #control-panel { width: 360px; background-color: rgba(15, 23, 42, 0.9); border-left: 1px solid rgba(56, 189, 248, 0.2); padding: 30px; display: flex; flex-direction: column; justify-content: center; box-shadow: -10px 0 30px rgba(0,0,0,0.5); z-index: 10; }
        h2 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .control-group { margin-bottom: 25px; }
        label { display: flex; justify-content: space-between; font-size: 14px; color: #cbd5e1; margin-bottom: 8px; }
        label span { color: #38bdf8; font-weight: bold; }
        input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }
        .results-panel { background-color: rgba(30, 41, 59, 0.5); border: 1px solid rgba(56, 189, 248, 0.1); border-radius: 12px; padding: 20px; margin-top: 20px; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 16px; }
        .result-row:last-child { margin-bottom: 0; }
        .prob-val { font-weight: bold; color: #34d399; }
        .instruction { margin-top: 40px; font-size: 12px; color: #64748b; text-align: center; line-height: 1.5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="control-panel">
        <h2>Bloch Sphere</h2>
        <p class="subtitle">Visualizing a Qubit State</p>
        
        <div class="control-group">
            <label for="theta">Theta (θ) - Amplitude: <span id="theta-val">45°</span></label>
            <input type="range" id="theta" min="0" max="180" value="45">
        </div>
        
        <div class="control-group">
            <label for="phi">Phi (ϕ) - Phase: <span id="phi-val">45°</span></label>
            <input type="range" id="phi" min="0" max="360" value="45">
        </div>
        
        <div class="results-panel">
            <div class="result-row">
                <span>Probability of |0⟩:</span>
                <span id="prob0" class="prob-val">85.4%</span>
            </div>
            <div class="result-row">
                <span>Probability of |1⟩:</span>
                <span id="prob1" class="prob-val">14.6%</span>
            </div>
        </div>
        
        <p class="instruction">Left-click and drag to rotate the sphere.<br>Right-click to pan, or scroll to zoom in/out.</p>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(3, 2, 4);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
        const sphereMat = new THREE.MeshPhongMaterial({
            color: 0x1e293b,
            transparent: true,
            opacity: 0.15,
            wireframe: false,
            side: THREE.DoubleSide
        });
        const mainSphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(mainSphere);

        const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.3 });
        const sphereWire = new THREE.Mesh(sphereGeo, wireframeMat);
        scene.add(sphereWire);

        const ringGeo = new THREE.RingGeometry(0.99, 1, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x475569, side: THREE.DoubleSide });
        const equator = new THREE.Mesh(ringGeo, ringMat);
        equator.rotation.x = Math.PI / 2;
        scene.add(equator);

        const arrowX = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 1.2, 0xef4444, 0.1, 0.05); 
        const arrowY = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0), 1.2, 0x3b82f6, 0.1, 0.05); 
        const arrowZ = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), 1.2, 0x38bdf8, 0.1, 0.05); 
        scene.add(arrowX);
        scene.add(arrowY);
        scene.add(arrowZ);

        const vectorMaterial = new THREE.MeshPhongMaterial({ color: 0x34d399 });
        const vectorGroup = new THREE.Group();
        scene.add(vectorGroup);

        const cylinderGeo = new THREE.CylinderGeometry(0.015, 0.015, 1, 8);
        cylinderGeo.translate(0, 0.5, 0); 
        const vectorShaft = new THREE.Mesh(cylinderGeo, vectorMaterial);
        vectorGroup.add(vectorShaft);

        const coneGeo = new THREE.ConeGeometry(0.04, 0.1, 16);
        coneGeo.translate(0, 1, 0);
        const vectorCone = new THREE.Mesh(coneGeo, vectorMaterial);
        vectorGroup.add(vectorCone);

        const glowGeo = new THREE.SphereGeometry(0.03, 16, 16);
        glowGeo.translate(0, 1, 0);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x6ee7b7 });
        const vectorGlow = new THREE.Mesh(glowGeo, glowMat);
        vectorGroup.add(vectorGlow);

        const thetaSlider = document.getElementById('theta');
        const phiSlider = document.getElementById('phi');
        const thetaVal = document.getElementById('theta-val');
        const phiVal = document.getElementById('phi-val');
        const prob0Text = document.getElementById('prob0');
        const prob1Text = document.getElementById('prob1');

        function updateQubitState() {
            const thetaDeg = parseFloat(thetaSlider.value);
            const phiDeg = parseFloat(phiSlider.value);

            thetaVal.innerText = thetaDeg + "°";
            phiVal.innerText = phiDeg + "°";

            const thetaRad = (thetaDeg * Math.PI) / 180;
            const phiRad = (phiDeg * Math.PI) / 180;

            vectorGroup.rotation.set(0, 0, 0);
            vectorGroup.rotation.z = -thetaRad;
            vectorGroup.rotation.y = phiRad;

            const p0 = Math.pow(Math.cos(thetaRad / 2), 2) * 100;
            const p1 = Math.pow(Math.

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng Khối cầu Bloch 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }
        #canvas-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }
        #control-panel {
            width: 360px;
            background-color: rgba(15, 23, 42, 0.9);
            border-left: 1px solid rgba(56, 189, 248, 0.2);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
            z-index: 10;
        }
        h2 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .control-group {
            margin-bottom: 25px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        label span {
            color: #38bdf8;
            font-weight: bold;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #38bdf8;
            cursor: pointer;
        }
        .results-panel {
            background-color: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(56, 189, 248, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .result-row:last-child {
            margin-bottom: 0;
        }
        .prob-val {
            font-weight: bold;
            color: #34d399;
        }
        .instruction {
            margin-top: 40px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="control-panel">
        <h2>Khối Cầu Bloch</h2>
        <p class="subtitle">Trực quan hóa trạng thái một Qubit</p>

        <div class="control-group">
            <label for="theta">Góc Theta (θ) - Biên độ: <span id="theta-val">45°</span></label>
            <input type="range" id="theta" min="0" max="180" value="45">
        </div>

        <div class="control-group">
            <label for="phi">Góc Phi (ϕ) - Pha: <span id="phi-val">45°</span></label>
            <input type="range" id="phi" min="0" max="360" value="45">
        </div>

        <div class="results-panel">
            <div class="result-row">
                <span>Xác suất ra |0⟩:</span>
                <span id="prob0" class="prob-val">85.4%</span>
            </div>
            <div class="result-row">
                <span>Xác suất ra |1⟩:</span>
                <span id="prob1" class="prob-val">14.6%</span>
            </div>
        </div>

        <p class="instruction">Dùng chuột trái để xoay khối cầu.<br>Dùng chuột phải để di chuyển hoặc cuộn để phóng to/thu nhỏ.</p>
    </div>

    <script>
        // --- KHỞI TẠO CẢNH TRÍ 3D (THREE.JS) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Camera
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(3, 2, 4);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Điều khiển chuột (OrbitControls)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Ánh sáng
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // --- VẼ CÁC THÀNH PHẦN KHỐI CẦU ---
        
        // 1. Quả cầu chính (Trong suốt)
        const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
        const sphereMat = new THREE.MeshPhongMaterial({
            color: #1e293b,
            transparent: true,
            opacity: 0.15,
            wireframe: false,
            side: THREE.DoubleSide
        });
        const mainSphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(mainSphere);

        // Đuờng lưới vĩ tuyến/kinh tuyến để dễ nhìn không gian 3D
        const wireframeMat = new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, transparent: true, opacity: 0.3 });
        const sphereWire = new THREE.Mesh(sphereGeo, wireframeMat);
        scene.add(sphereWire);

        // 2. Đường Xích đạo (Equator)
        const ringGeo = new THREE.RingGeometry(0.99, 1, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x475569, side: THREE.DoubleSide });
        const equator = new THREE.Mesh(ringGeo, ringMat);
        equator.rotation.x = Math.PI / 2;
        scene.add(equator);

        // 3. Hệ trục tọa độ (X, Y, Z)
        // Trong hệ trục chuẩn của Bloch: Z hướng thẳng đứng lên trên
        const arrowX = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 1.2, 0xef4444, 0.1, 0.05); // Trục X (Đỏ)
        const arrowY = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 0), 1.2, 0x3b82f6, 0.1, 0.05); // Trục Y (Xanh dương)
        const arrowZ = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 0), 1.2, 0x38bdf8, 0.1, 0.05); // Trục Z (Xanh lam - Vertical)
        scene.add(arrowX);
        scene.add(arrowY);
        scene.add(arrowZ);

        // 4. Vector Trạng thái (Kim chỉ trạng thái qubit)
        const vectorMaterial = new THREE.MeshPhongMaterial({ color: 0x34d399 });
        const vectorGroup = new THREE.Group();
        scene.add(vectorGroup);

        // Thân mũi tên vector
        const cylinderGeo = new THREE.CylinderGeometry(0.015, 0.015, 1, 8);
        cylinderGeo.translate(0, 0.5, 0); // Đặt gốc ở đáy ống cylinder
        const vectorShaft = new THREE.Mesh(cylinderGeo, vectorMaterial);
        vectorGroup.add(vectorShaft);

        // Đầu nhọn mũi tên và điểm sáng phát quang ở đầu
        const coneGeo = new THREE.ConeGeometry(0.04, 0.1, 16);
        coneGeo.translate(0, 1, 0);
        const vectorCone = new THREE.Mesh(coneGeo, vectorMaterial);
        vectorGroup.add(vectorCone);

        const glowGeo = new THREE.SphereGeometry(0.03, 16, 16);
        glowGeo.translate(0, 1, 0);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x6ee7b7 });
        const vectorGlow = new THREE.Mesh(glowGeo, glowMat);
        vectorGroup.add(vectorGlow);


        // --- LOGIC ĐIỀU KHIỂN & CẬP NHẬT TỌA ĐỘ ---
        const thetaSlider = document.getElementById('theta');
        const phiSlider = document.getElementById('phi');
        
        const thetaVal = document.getElementById('theta-val');
        const phiVal = document.getElementById('phi-val');
        
        const prob0Text = document.getElementById('prob0');
        const prob1Text = document.getElementById('prob1');

        function updateQubitState() {
            const thetaDeg = parseFloat(thetaSlider.value);
            const phiDeg = parseFloat(phiSlider.value);

            // Cập nhật text hiển thị số độ
            thetaVal.innerText = thetaDeg + "°";
            phiVal.innerText = phiDeg + "°";

            // Chuyển đổi sang Radian
            const thetaRad = (thetaDeg * Math.PI) / 180;
            const phiRad = (phiDeg * Math.PI) / 180;

            // Tính toán hướng quay của Vector dựa trên góc Euler hoặc ma trận xoay
            // Reset góc quay mặc định
            vectorGroup.rotation.set(0, 0, 0);
            // Xoay quanh trục Z theo góc Theta, sau đó xoay quanh trục Y thẳng đứng theo góc Phi
            vectorGroup.rotation.z = -thetaRad;
            vectorGroup.rotation.y = phiRad;

            // Tính toán xác suất cơ học lượng tử: P(0) = cos²(θ/2), P(1) = sin²(θ/2)
            const p0 = Math.pow(Math.cos(thetaRad / 2), 2) * 100;
            const p1 = Math.pow(Math.sin(thetaRad / 2), 2) * 100;

            // Hiển thị kết quả phần trăm
            prob0Text.innerText = p0.toFixed(1) + "%";
            prob1Text.innerText = p1.toFixed(1) + "%";
        }

        // Lắng nghe sự kiện kéo thanh trượt
        thetaSlider.addEventListener('input', updateQubitState);
        phiSlider.addEventListener('input', updateQubitState);

        // Khởi chạy lần đầu tiên
        updateQubitState();

        // Xử lý khi co giãn màn hình trình duyệt
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Vòng lặp Render hình ảnh liên tục (Animation Loop)
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
